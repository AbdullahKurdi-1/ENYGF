# Must match cfd/openfoam/case_geometry.py (the CFD case constants).
geometry:
  rod_radius: 0.07          # m
  half_pitch: 0.0775        # m, quarter unit cell spans 0..half_pitch in x and y
  dh_cell: 0.078497         # m, quarter unit cell hydraulic diameter
  dh_dns: 0.0712            # m, 2023 DNS domain hydraulic diameter (for its xi/Dh axis)

flow:
  u_bulk: 1.0               # 2023 DNS normalisation, U_b = 1
  re_values: [9800]         # add values here only if you also ran CFD at those Re

thermal:
  pr_values: [0.025, 1.0, 2.0, 7.0]
  pr_turbulent: 0.9
  wall_heat_flux: 1.0       # iso-flux BC (rho*cp = 1)
  sink_iso_t: 1.0           # iso-temperature volumetric sink (2023 DNS)

model:
  fourier_features: 32
  fourier_scale: 1.0        # coordinates are normalised to [0, 1] before this. Keep low:
                            # high frequencies add wiggles that wreck the PDE derivatives
  momentum_hidden: [128, 128, 128, 128]
  thermal_hidden: [128, 128, 128, 128]
  wall_layer: 0.002         # m, length scale of the hard no-slip / T=0 wall factor
  wall_feature_scales: [0.0001, 0.0003, 0.001, 0.003, 0.01]   # m, near-wall input features
  nut_scale: 0.001          # m2/s
  k_scale: 0.01             # m2/s2
  g_scale: 0.2              # m/s2, typical driving pressure gradient 4*u_tau^2/Dh

training:
  epochs_data: 3000         # phase 1: fit the CFD data (+ bulk velocity, symmetry, gauge)
  epochs_physics: 3000      # phase 2: + PDE residuals and wall heat flux
  ramp_epochs: 500          # phase 2 terms are ramped in linearly over this many epochs
  lr: 1.0e-3
  lr_final_fraction: 0.02   # cosine decay to lr * this
  batch_data: 4096          # data points per quantity per epoch (random mini-batch)
  holdout_fraction: 0.2     # cells never used in training, to measure the test error
  n_collocation: 2048
  n_boundary: 512
  print_every: 250
  seed: 0
  loss_weights:
    data_w: 1.0
    data_nut: 1.0
    data_k: 0.3
    data_T: 1.0
    data_tau_w: 1.0           # wall shear stress per rod face
    data_q_w: 1.0             # iso-temperature wall heat flux per rod face
    bulk_velocity: 1.0
    symmetry: 0.1
    gauge: 1.0
    pde_momentum: 1.0e-3
    wall_shear_balance: 1.0e-2
    pde_energy: 3.0e-4
    wall_heat_flux: 0.1

paths:
  cfd_field: ../digitized_data/cfd_generated/cfd_field.csv
  cfd_profiles: ../digitized_data/cfd_generated/cfd_profiles.csv
  cfd_nusselt: ../digitized_data/cfd_generated/cfd_nusselt.csv
  digitized_dir: ../digitized_data
  dns_nusselt: ../paper_reference/table_dns_2023_nusselt.csv
  checkpoint: outputs/pinn_checkpoint.pt
  loss_history: outputs/loss_history.csv
  plots_dir: outputs/plots
